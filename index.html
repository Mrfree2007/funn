    <style>
        :root {
            --primary: #ff2a5f;
            --secondary: #7000ff;
            --bg-dark: #0a051b;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-light: #ffffff;
            --text-muted: #a0aec0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* 3D Canvas Background Fix */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px;
            position: relative;
            z-index: 1;
        }

        /* Header Style */
        header {
            text-align: center;
            margin-bottom: 60px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* 3D Perspective Grid */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            perspective: 1000px; /* Crucial for 3D card effects */
        }

        /* 3D Hover Card Implementation */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.5s ease;
            transform-style: preserve-3d;
        }

        .card:hover {
            transform: translateY(-10px) rotateX(10px) rotateY(-5px);
            box-shadow: 0 20px 40px rgba(255, 42, 95, 0.2);
            border-color: rgba(255, 42, 95, 0.4);
        }

        .card a {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        /* Image Wrapper with Zoom Animation */
        .img-container {
            width: 100%;
            height: 320px;
            overflow: hidden;
            position: relative;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .card:hover img {
            transform: scale(1.1);
        }

        /* Dark Gradient Overlay over Images */
        .img-container::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(to top, rgba(10, 5, 27, 0.9), transparent);
        }

        /* Card Text Content */
        .card-content {
            padding: 25px 20px;
            text-align: center;
            transform: translateZ(30px); /* Pushes text out in 3D space on tilt */
        }

        .card-content h3 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .card-content span {
            font-size: 0.85rem;
            color: var(--primary);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 2px;
            display: inline-block;
            margin-bottom: 15px;
        }

        /* Interactive Action Button inside Cards */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: var(--text-light);
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .card:hover .btn {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            box-shadow: 0 5px 15px rgba(255, 42, 95, 0.4);
            border-color: transparent;
        }
    </style>
</head>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    
    <script>
        // 1. Initialize Animate On Scroll (AOS)
        AOS.init({
            once: true,
            duration: 800,
            easing: 'ease-out-quad'
        });

        // 2. Three.js Interactive 3D Background Animation
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // Generate a 3D Particle Constellation Dust field
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 120;
        const posArray = new Float32Array(particlesCount * 3);

        for(let i=0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 10;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

        // Create sleek, glowing design nodes
        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.03,
            color: '#ff2a5f',
            transparent: true,
            opacity: 0.7
        });

        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);
        camera.position.z = 3;

        // Mouse Interactivity tracking for background shift
        let mouseX = 0;
        let mouseY = 0;
        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX / window.innerWidth) - 0.5;
            mouseY = (event.clientY / window.innerHeight) - 0.5;
        });

        // Animation Frame Loop
        const animate = () => {
            requestAnimationFrame(animate);
            
            // Continuous rotation
            particlesMesh.rotation.y += 0.0015;
            particlesMesh.rotation.x += 0.0008;

            // Fluid reactive movement towards mouse coordinates
            particlesMesh.position.x += (mouseX * 0.5 - particlesMesh.position.x) * 0.05;
            particlesMesh.position.y += (-mouseY * 0.5 - particlesMesh.position.y) * 0.05;

            renderer.render(scene, camera);
        };
        animate();

        // Responsive resize recalculation
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
